version: '3.8'

services:
  # ─── MongoDB Database ────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0-jammy
    container_name: venueaura-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: venueaura
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - venueaura-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Express Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: venueaura-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/venueaura
      CLIENT_URL: http://localhost:80
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-venueaura_production_jwt_access_secret_key_32bytes}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-venueaura_production_jwt_refresh_secret_key_32bytes}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret_mock}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-mock_cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-mock_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-mock_secret}
    ports:
      - '5000:5000'
    networks:
      - venueaura-network

  # ─── React + Nginx Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: venueaura-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '80:80'
    networks:
      - venueaura-network

networks:
  venueaura-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
