name: VenueAura CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Lint, Test, and Build ────────────────────────────────────────────
  build-and-test:
    name: Lint, Test & Frontend Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      # Install Root, Backend & Frontend Dependencies
      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      # Backend Syntax & Unit Checks
      - name: Check Backend Syntax & App Loading
        run: node -e "require('./backend/src/app'); require('./backend/src/config/socket'); console.log('Backend verified successfully');"
        env:
          NODE_ENV: test
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_minimum_32_characters_long
          REFRESH_TOKEN_SECRET: ci_test_refresh_token_secret_minimum_32_characters_long

      # Frontend Production Build
      - name: Build Frontend Application
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: http://localhost:5000/api/v1

  # ─── Job 2: Container Verification ───────────────────────────────────────────
  docker-validation:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: venueaura-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: venueaura-frontend:test
